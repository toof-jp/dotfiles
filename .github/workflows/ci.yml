name: CI

on:
  push:
    branches: [main]
    paths:
      - "nix/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "nix/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # secrets are not available in step-level if:, so gate the cachix steps
  # through the env context (empty on fork PRs and until the token is set)
  CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            http-connections = 128
            max-substitution-jobs = 128
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: toof-jp
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check ./nix --all-systems

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nixos-dev
            attr: nixosConfigurations.dev.config.system.build.toplevel
          - name: nixos-kubevirt
            attr: nixosConfigurations.kubevirt.config.system.build.toplevel
          - name: home-linux
            attr: homeConfigurations."toof@linux".activationPackage
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Full NixOS closures need more than the ~14GB free on a stock runner.
      # Delete in parallel so we're not serialising ~40GB of `rm -rf` I/O.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /opt/hostedtoolcache &
          wait
          df -h /

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            http-connections = 128
            max-substitution-jobs = 128

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: toof-jp
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.attr }}
        run: nix build './nix#${{ matrix.attr }}' --no-link --print-build-logs

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            http-connections = 128
            max-substitution-jobs = 128

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: toof-jp
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build homeConfigurations."toof@mac".activationPackage
        run: nix build './nix#homeConfigurations."toof@mac".activationPackage' --no-link --print-build-logs
