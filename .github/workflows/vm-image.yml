name: Publish VM image to GHCR

on:
  push:
    branches: [main]
    paths:
      - "nix/**"
      - ".github/workflows/vm-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The NixOS closure + qcow2 + docker layer need more than the ~14GB
      # free on a stock runner
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          df -h /

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: toof-jp
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build qcow2
        run: |
          nix build ./nix#kubevirt-image
          cp -L result/*.qcow2 nix/containerdisk/nixos.qcow2

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nixos-dev
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./nix/containerdisk
          file: ./nix/containerdisk/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
