"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
${custom.vm}$username@$hostname $kubernetes $git_branch $git_commit$git_state$git_status$fill$time
$directory
$character
"""

# Show a bright "VM" badge when running inside a virtual machine
# (systemd-detect-virt --vm: kvm on the kubevirt VM, none on bare metal;
# not present on macOS, so the module is simply skipped there).
[custom.vm]
when = "systemd-detect-virt --vm -q"
style = "bold fg:black bg:yellow"
format = '[ VM ]($style) '

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'

[fill]
symbol = ' '

[username]
style_root = "red"
style_user = "red"
format = '[$user]($style)'
show_always = true

[hostname]
ssh_only = false
ssh_symbol = "SSH"
style = "red"
format = '[$hostname]($style) [$ssh_symbol](green)'

[git_branch]
symbol = ""
style = "green"
format = '[$branch]($style)'

[directory]
truncation_length = 0
truncate_to_repo = false
style = "yellow"

[time]
format = "[$time]($style)"
time_format = "%Y-%m-%d %H:%M:%S%z"
style = "cyan"
disabled = false

[kubernetes]
format = '[$cluster $context]($style)'
disabled = false
style = "purple"

